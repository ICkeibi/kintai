<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>I・C・S勤怠管理</title>

  <!-- 現在の本番PWA設定をそのまま使用 -->
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="apple-touch-icon" href="icon-white-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-white-192.png">

  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="勤怠打刻">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #gasFrame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <iframe
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbzuUVbIKZZ5tNmJa-aTHpfUhIuH-fLBd8YwBmeY9OExAk-DJaEjDf7wjv-WXbq-C1nO/exec"
    allow="geolocation"
  ></iframe>


<script>
// ID・氏名だけをこのGitHubサイト内に記憶。URLへIDを追加しない。
(function(){
 const channel='ics-attendance-identity-v1',key='ics-attendance-remembered-employee-v1',sessions=new WeakMap();
 function allowedOrigin(origin){try{const u=new URL(origin),h=u.hostname;return u.protocol==='https:'&&(h==='script.google.com'||h==='script.googleusercontent.com'||h.endsWith('-script.googleusercontent.com'));}catch(e){return false;}}
 function validIdentity(value){return value&&typeof value.id==='string'&&typeof value.name==='string'&&value.id.length<=64&&value.name.length<=200;}
 window.addEventListener('message',function(event){
  const m=event.data;if(!event.source||!allowedOrigin(event.origin)||!m||m.channel!==channel||typeof m.requestId!=='string'||m.requestId.length>100)return;
  if(m.action==='get'){
   sessions.set(event.source,m.requestId);let identity={id:'',name:''};
   try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(validIdentity(saved))identity=saved;}catch(e){}
   event.source.postMessage({channel:channel,action:'restore',requestId:m.requestId,identity:identity},event.origin);
  }else if(m.action==='set'&&sessions.get(event.source)===m.requestId&&validIdentity(m.identity)){
   try{if(m.identity.id)localStorage.setItem(key,JSON.stringify({id:m.identity.id.trim(),name:m.identity.name}));else localStorage.removeItem(key);}catch(e){}
  }
 });
})();
</script>

</body>
</html>
